  <style>
    :root {
      --oxford: #0f1b2d;
      --oxford-soft: #16263c;
      --ink: #1f2937;
      --muted: #5f6b7a;
      --line: #d9dee7;
      --paper: #f7f5f1;
      --card: #ffffff;
      --gold: #b08d57;
      --gold-soft: #d4b483;
      --shadow: 0 20px 45px rgba(15, 27, 45, 0.10);
      --radius: 18px;
      --sidebar-width: 300px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", Tahoma, serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, rgba(176, 141, 87, 0.08), transparent 28%), linear-gradient(135deg, #f8f6f2 0%, #f3efe8 100%);
      min-height: 100vh;
    }
    body[dir="rtl"] { font-family: "Tahoma", "Segoe UI", sans-serif; }
    a { color: var(--oxford); text-decoration: none; transition: 0.3s; }
    a:hover { color: var(--gold); }

    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, #0d1726 0%, #13233a 100%);
      color: #f4efe6;
      padding: 24px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid rgba(255,255,255,0.08);
      box-shadow: 8px 0 30px rgba(0,0,0,0.08);
      overflow-y: auto;
    }
    body[dir="rtl"] .sidebar { border-right: none; border-left: 1px solid rgba(255,255,255,0.08); }

    .lang-switcher { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .lang-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(212, 180, 131, 0.3); color: #d9c7aa; padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 600; }
    .lang-btn.active { background: var(--gold); color: #0d1726; border-color: var(--gold-soft); }

    .brand { text-align: center; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid rgba(212, 180, 131, 0.22); }
    .brand img { width: 92px; height: 92px; object-fit: cover; border-radius: 50%; border: 3px solid rgba(212, 180, 131, 0.7); box-shadow: 0 10px 24px rgba(0,0,0,0.22); margin-bottom: 12px; }
    .brand h1 { margin: 0; font-size: 1.38rem; color: #ffffff; }
    .brand p { margin: 6px 0 0; color: #d9c7aa; font-size: 0.9rem; }

    .nav { display: flex; flex-direction: column; gap: 8px; }
    .nav button {
      width: 100%; text-align: left; background: rgba(255,255,255,0.03); color: #f7f1e8; border: 1px solid rgba(255,255,255,0.08); 
      padding: 12px; border-radius: 12px; font-size: 0.94rem; cursor: pointer; transition: all 0.28s ease;
    }
    body[dir="rtl"] .nav button { text-align: right; }
    .nav button.active { background: var(--gold); color: #fff; }

    .content { flex: 1; padding: 28px; max-width: 1200px; }
    .hero { background: rgba(255,255,255,0.74); border: 1px solid rgba(176, 141, 87, 0.16); border-radius: 24px; padding: 20px 24px; box-shadow: var(--shadow); margin-bottom: 18px; }
    .panel { display: none; opacity: 0; transform: translateY(18px); transition: 0.35s ease; }
    .panel.active { display: block; opacity: 1; transform: translateY(0); }

    .section-card { background: rgba(255,255,255,0.85); border: 1px solid rgba(176, 141, 87, 0.16); border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); margin-bottom: 24px; }
    .section-card h3 { margin: 0 0 14px; font-size: 1.45rem; color: var(--oxford); position: relative; padding-bottom: 10px; border-bottom: 2px solid var(--gold); display: inline-block; }
    
    .pub-item { display: flex; gap: 20px; margin-bottom: 25px; align-items: flex-start; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    .pub-item img { width: 110px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    .feature-image { width: 100%; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .link-list a { display: inline-block; margin: 5px; padding: 8px 15px; background: #eee; border-radius: 8px; font-size: 0.9rem; }
    
    @media (max-width: 980px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; }
    }
  </style>

</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="fa">FA</button>
      </div>
      <div class="brand">
        <img src="profile.jpg" alt="Adrian Morawdi" />
        <h1 data-i18n="brand_name">Adrian Morawdi</h1>
        <p data-i18n="brand_title">Literary Researcher & Author</p>
      </div>
      <nav class="nav">
        <button class="tab-btn active" data-target="about" data-i18n="nav_about">About</button>
        <button class="tab-btn" data-target="publications" data-i18n="nav_pub">Publications</button>
        <button class="tab-btn" data-target="research" data-i18n="nav_res">Research</button>
        <button class="tab-btn" data-target="teaching" data-i18n="nav_teach">Teaching</button>
        <button class="tab-btn" data-target="contact" data-i18n="nav_contact">Contact</button>
      </nav>
    </aside>

    <main class="content">
      <section class="hero">

      <section id="about" class="panel active">

      <section id="publications" class="panel">

          <h3 data-i18n="nav_pub">Publications</h3>

      </section>

      <section id="research" class="panel">

      <section id="teaching" class="panel">

        </div>
      </section>

      <section id="contact" class="panel">
        <div class="section-card">
          <h3 data-i18n="nav_contact">Contact</h3>
          <div id="contact_content"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const i18n = {
      en: {
        dir: "ltr",
        brand_name: "Adrian Morawdi",
        brand_title: "Literary Researcher & Author",
        nav_about: "About", nav_pub: "Publications", nav_res: "Research", nav_teach: "Teaching", nav_contact: "Contact",
        hero_title: "Academic Portfolio", hero_desc: "Official website of Adrian Morawdi.",
        about_html: `<p><strong>Adrian Morawdi</strong> is an interdisciplinary literary researcher and author focused on quantum narratology and postmodern theory. He is currently based at Ferdowsi University of Mashhad.</p>`,
        pub_html: `
          <div class="pub-item">
            <img src="incidental-agency-cover.jpg" alt="Incidental Agency">
            <div>
              <h4>Incidental Agency (Book)</h4>
              <p>A philosophical inquiry into human agency and unpredictable events. Published 2026.</p>
              <a href="https://doi.org/10.5281/zenodo.22766183" target="_blank">View DOI →</a>
            </div>
          </div>
          <div class="pub-item">
            <div>
              <h4>Quantum Thinking and Literary Meaning (Paper)</h4>
              <p>Research paper exploring the intersection of quantum mechanics and narratology.</p>
              <a href="https://doi.org/10.5281/zenodo.22863013" target="_blank">View Paper →</a>
            </div>
          </div>`,
        res_html: `<ul><li>Quantum Narratology</li><li>Postmodern Aesthetics</li><li>Comparative Poetics</li></ul>`,
        teach_html: `<p>Instructor of English Literature and Advanced Language Acquisition (B1-C2).</p>`,
        contact_html: `<p>Email: <a href="mailto:adriennmoraw@gmail.com">adriennmoraw@gmail.com</a></p>`
      },
      fa: {
        dir: "rtl",
        brand_name: "آدرین مرادی",
        brand_title: "پژوهشگر ادبیات و نویسنده",
        nav_about: "درباره", nav_pub: "آثار", nav_res: "پژوهش", nav_teach: "تدریس", nav_contact: "تماس",
        hero_title: "وب‌سایت رسمی", hero_desc: "پرتفولیو آکادمیک آدرین مرادی (علیرضا مرادی).",
        about_html: `<p><strong>آدرین مرادی</strong> پژوهشگر میان‌رشته‌ای ادبیات و نویسنده است که در حوزه‌های نقد پست‌مدرن و روایت‌شناسی کوانتومی فعالیت می‌کند.</p>`,
        pub_html: `
          <div class="pub-item">
            <img src="incidental-agency-cover.jpg" alt="Incidental Agency">
            <div>
              <h4>کتاب: Incidental Agency</h4>
              <p>کاوشی فلسفی در عاملیت انسانی و رویدادهای پیش‌بینی‌ناپذیر.</p>
              <a href="https://doi.org/10.5281/zenodo.22766183" target="_blank">مشاهده در ذنودو ←</a>
            </div>
          </div>`,
        res_html: `<ul><li>روایت‌شناسی کوانتومی</li><li>زیبایی‌شناسی پست‌مدرن</li><li>بوطیقای تطبیقی</li></ul>`,
        teach_html: `<p>مدرس ادبیات انگلیسی و مهارت‌های پیشرفته زبان (سطوح دانشگاهی).</p>`,
        contact_html: `<p>ایمیل: <a href="mailto:adriennmoraw@gmail.com">adriennmoraw@gmail.com</a></p>`
      }
    };

    function setLang(l) {
      const d = i18n[l];
      document.body.setAttribute('dir', d.dir);
      document.querySelectorAll('[data-i18n]').forEach(el => el.innerText = d[el.getAttribute('data-i18n')]);
      document.getElementById('about_content').innerHTML = d.about_html;
      document.getElementById('pub_content').innerHTML = d.pub_html;
      document.getElementById('res_content').innerHTML = d.res_html;
      document.getElementById('teach_content').innerHTML = d.teach_html;
      document.getElementById('contact_content').innerHTML = d.contact_html;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn, .panel').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.target).classList.add('active');
      });
    });

    document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLang(btn.dataset.lang)));
    setLang('en');
  </script>
</body>
